spring:
  application:
    name: movie-booking-system
  datasource:
    #url: jdbc:mysql://localhost:3306/movie_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
    url: ${DB_URL}
    #driver-class-name: com.mysql.cj.jdbc.Driver
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10          # 30 was way oversized for your traffic — smaller pool = fewer connections to spin up/down
      minimum-idle: 0                # THE FIX — don't force-hold connections open; let the pool shrink to 0 so Neon can autosuspend
      connection-timeout: 15000      # a bit more headroom for Neon's cold wake-up (~1-2s) under load
      idle-timeout: 120000           # close unused connections after 2 min idle
      max-lifetime: 1800000
      initialization-fail-timeout: 20000   # retry initial connect instead of crashing boot if Neon is still waking up
      pool-name: HikariCP-SeatBookingPool

  rabbitmq:
    addresses: ${RABBITMQ_URL}





  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update



    show-sql: true

    properties:
      hibernate:
        format_sql: true
        #dialect: org.hibernate.dialect.MySQLDialect
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata
          batch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        generate_statistics: false
  mvc:
    async:
      request-timeout: 10000ms
  data:
    redis:
      url: ${REDIS_URL}

logging:
  level:
    org.hibernate.SQL: INFO
    # org.hibernate.orm.jdbc.bind: TRACE
server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 200
      min-spare: 20
    connection-timeout: 20000ms
    accept-count: 500

jwt:
  secret-key: ${SECRET_KEY}
  expiration: 86400000
email:
  service:
    url: ${EMAIL_SERVICE}
cloudinary:
  cloud-name: ${CLOUD_NAME}
  api-key: ${API_KEY}
  api-secret: ${API_SECRET}
  
management:
  health:
    db:
      enabled: false
razorpay:
  key:
    id: ${RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET}
