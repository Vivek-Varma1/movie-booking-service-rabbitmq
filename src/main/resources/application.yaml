spring:
  application:
    name: movie-booking-system
  datasource:
    url: jdbc:mysql://localhost:3306/movie_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
    username: root
    password: Vivek@1436
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 10000
      idle-timeout: 300000
        # Maximum lifetime of a connection in the pool in milliseconds
      max-lifetime: 1800000
      pool-name: HikariCP-SeatBookingPool

  Kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

  jpa:
    hibernate:
      ddl-auto: update



    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Kolkata
          batch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        generate_statistics: true
  mvc:
    async:
      request-timeout: 10000ms
  data:
    redis:
          host: localhost
          port: 6379

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
server:
  port: 8080
  tomcat:
    threads:
      max: 400
      min-spare: 50
    connection-timeout: 20000ms
    accept-count: 500

